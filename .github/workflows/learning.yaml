name: Mostrar poyecto

on:
  workflow_dispatch:
jobs:
  
  backend:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5

      - run: |
          cat <<EOF> .env.prod
          APP_NAME=${{secrets.APP_NAME}}
          APP_HOST=${{secrets.APP_HOST}}
          APP_PORT=${{secrets.APP_POST}}
          EOF
      - run: la
      - run: cat .env.prod


      

