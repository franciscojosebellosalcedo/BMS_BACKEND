name: CD BMS

on:
  workflow_dispatch:

jobs:

  cd:

    runs-on: ubuntu-latest
    
    steps:
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
      
      - name: Crear carpeta SSH
        run: |
          mkdir -p ~/.ssh

      - name: Agregar llave privada
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519

      - name: Configurar permisos
        run: |
          chmod 600 ~/.ssh/id_ed25519

      - name: Verificar puerto SSH
        run: |
          timeout 10 bash -c "</dev/tcp/${{ secrets.TAILSCALE_IP  }}/22"

      - name: Obtener host key
        run: |
          ssh-keyscan -T 10 -v ${{ secrets.TAILSCALE_IP }}

      - name: Agregar servidor a known_hosts
        run: |
          ssh-keyscan ${{ secrets.TAILSCALE_IP }} >> ~/.ssh/known_hosts

      - name: Probar SSH
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.TAILSCALE_IP }} "echo Hola desde GitHub Actions"
